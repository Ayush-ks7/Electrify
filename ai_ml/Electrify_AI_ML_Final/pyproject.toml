[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "electrify-ai-ml"
version = "1.0.0"
description = "Standalone AI/ML component for Electrify"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy==2.3.5",
  "pandas==2.2.3",
  "scikit-learn==1.8.0",
  "joblib==1.5.3",
  "fastapi==0.128.2",
  "pydantic==2.13.4",
  "uvicorn==0.48.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
